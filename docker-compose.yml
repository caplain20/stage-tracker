services:
  db:
    image: postgres:17
    container_name: stage-tracker-db
    environment:
      POSTGRES_USER: stagetracker
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: stagetracker
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagetracker"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data: